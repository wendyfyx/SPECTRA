[project]
name = "tpa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.11"
dependencies = [
    "dipy>=1.11.0",
    "fury>=0.12.0",
    "scilpy>=2.2.0",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "plotly>=6.3.1",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "nbformat>=5.10.4",
]

[project.scripts]
tpa_profile = "tpa.cli.tpa_profile:main"
tpa_lmm = "tpa.cli.tpa_lmm:main"
tpa_viz = "tpa.cli.tpa_viz:main"