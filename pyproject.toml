[project]
name = "spectra"
version = "0.1.0"
description = "Spatial inference for tractometry"
readme = "README.md"

requires-python = ">=3.11"
dependencies = [
    "dipy>=1.11.0",
    "fury>=0.12.0",
    "scilpy>=2.2.0",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "plotly>=6.3.1",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "nbformat>=5.10.4",
]

[project.scripts]
spectra_profile = "spectra.cli.spectra_profile:main"
spectra_viz = "spectra.cli.spectra_viz:main"
spectra_lmm_fdr = "spectra.cli.spectra_lmm_fdr:main"
spectra_lmm_plot = "spectra.cli.spectra_lmm_plot:main"
